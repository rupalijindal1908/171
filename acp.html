<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>
    <style>
        .navigation {
            border: none;
            border-radius: 15px;
            background-color: rgb(194, 194, 16);
            margin-bottom: 645px;
            padding: 25px;
        }

        a {
            padding: 25px;
            font-size: 25px;
            text-decoration: none;
            border-radius: 15px;
        }

        a:hover {
            color: rgb(255, 254, 192);
            font-size: 25px;
        }

        footer {
            background-color: rgb(194, 194, 16);
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <nav class="navigation">
        <a href="#">Home</a>
        <a href="#">About us</a>
        <a href="#">menu</a>
        <a href="#">gallery</a>
        <a href="#">services</a>
        <a href="#">offer</a>
    </nav>
    <footer>thank you</footer>
</body>

</html>
