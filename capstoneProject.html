<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>
    <style>
        .navigation{
            border: none;
            border-radius: 15px;
            background-color: olive;
            margin-bottom: 645px;
            padding: 25px;
        }
       a{
        padding: 25px;
        font-size: 25px;
        text-decoration: none;
        border-radius: 15px;
       }
       a:hover{
        color:white;
        font-size: 25px;
       }
       footer{
        background-color: olive;
        text-align:center;
        font-size: 20px;
    }
    </style>
</head>
<body>
      <nav class="navigation">
        <a href="#" >Home</a>
        <a href="#">About us</a>
        <a href="#">Contact us</a>
        <a href="#">gallery</a>
     </nav>
     <footer>thank you</footer>
</body>
</html>
